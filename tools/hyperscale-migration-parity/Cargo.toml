[package]
name = "hyperscale-migration-parity"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
chrono = "0.4"
db = { path = "../../crates/db", features = ["migration-parity"] }
futures = "0.3"
baseline-helix-dsl = { package = "helix-db", version = "=2.0.5" }
helix = { path = "../../../helix-hyperscale-migration-parity-source/enterprise/helix" }
hyperscale-slatedb = { package = "slatedb", path = "../../../helix-hyperscale-migration-parity-source/enterprise/slatedb/slatedb" }
target-slatedb = { package = "slatedb", git = "https://github.com/HelixDB/slatedb.git", rev = "c64286ec8e5aaa724f12a8c54b58fe73efcff534" }
target-slatedb-common = { package = "slatedb-common", git = "https://github.com/HelixDB/slatedb.git", rev = "c64286ec8e5aaa724f12a8c54b58fe73efcff534" }
object_store = { version = "0.12", features = ["aws"] }
object_store_014 = { package = "object_store", version = "0.14", features = ["aws"] }
roaring = { version = "0.11", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
libc = "0.2"
siphasher = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
