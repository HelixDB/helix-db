[workspace]
members = [
    "bindings/uniffi",
    "crates/ast",
    "crates/graph-algorithms",
    "crates/planner",
    "crates/server",
    "sdks/rust",
    "crates/cli",
    "crates/db",
]
exclude = ["bindings/uniffi-bindgen"]
resolver = "3"

[workspace.lints.clippy]
wildcard_enum_match_arm = "deny"
# optional companion:
match_wildcard_for_single_variants = "warn"
