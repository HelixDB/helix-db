[workspace]
members = [
    "bindings/uniffi",
    "crates/ast",
    "crates/ast-arena-derive",
    "crates/ast-bench",
    "crates/graph-algorithms",
    "crates/planner",
    "crates/cypher",
    "crates/server",
    "sdks/rust",
    "crates/cli",
    "crates/db",
    "crates/metrics",
    "crates/db-testkit",
    "crates/value-semantics",
    "tools/opencypher-tck",
]
exclude = ["bindings/uniffi-bindgen"]
resolver = "3"

[workspace.dependencies]
helix-ast = { path = "crates/ast" }
helix-graph-algorithms = { path = "crates/graph-algorithms" }
db = { path = "crates/db" }

[workspace.lints.clippy]
wildcard_enum_match_arm = "deny"
# optional companion:
match_wildcard_for_single_variants = "warn"

# The profile the server image ships with (see Dockerfile). On Graviton4,
# thin LTO with one codegen unit planned a median 8% faster than `release`
# (every planner benchmark 2-13% faster), for about twice the clean build
# time; fat LTO added under a point more for nearly three times the build.
# `release` stays as it is for local and benchmark builds.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
