[package]
name = "helix-db-testkit-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
db = { path = "../../db" }
helix-ast = { path = "../../ast", features = ["simd-json"] }
helix-db-testkit = { path = ".." }
helix-planner = { path = "../../planner" }
libfuzzer-sys = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[[bin]]
name = "query_json"
path = "fuzz_targets/query_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "query_json_arena"
path = "fuzz_targets/query_json_arena.rs"
test = false
doc = false
bench = false

[[bin]]
name = "planner_context_ast"
path = "fuzz_targets/planner_context_ast.rs"
test = false
doc = false
bench = false

[[bin]]
name = "planner_interpreter"
path = "fuzz_targets/planner_interpreter.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stateful_action_trace"
path = "fuzz_targets/stateful_action_trace.rs"
test = false
doc = false
bench = false

[workspace]
