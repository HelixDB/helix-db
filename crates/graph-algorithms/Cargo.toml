[package]
name = "helix-graph"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
description = "Storage-independent native graph representation and algorithms for Helix SDKs"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
approx = "0.5"
criterion = "0.5"

[[bench]]
name = "graph_algorithms"
harness = false

[lints]
workspace = true
