[package]
name = "server"
version = "0.1.0"
edition = "2024"

[features]
# Benchmark images only: explicit writer/reader role and periodic JSON samples.
async-index-benchmark = ["db/async-index-benchmark"]

[dependencies]
db = { path = "../db" }
helix-ast = { path = "../ast" }
helix-metrics = { path = "../metrics" }
helix-planner = { path = "../planner" }
axum = "0.8.8"
# Default features build mimalloc v3 from 0.1.49 on; keep the `v2` feature off.
mimalloc = "0.1.52"
object_store = { version = "0.14", features = ["aws"] }
prost = "0.14.3"
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slatedb = { git = "https://github.com/HelixDB/slatedb.git", rev = "77d4990879e0e4d04146a22f3ef3d5d775e204d6" }
sonic-rs = "0.5.8"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3.2"
tonic-prost-build = "0.14.6"

[dev-dependencies]
async-trait = "0.1"
helix-db = { path = "../../sdks/rust" }
helix-db-testkit = { path = "../db-testkit" }
tempfile = "3"
tokio-test = "0.4"
tokio-stream = { version = "0.1", features = ["net"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
