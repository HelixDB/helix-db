[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
db = { path = "../db" }
helix-ast = { path = "../ast" }
axum = "0.8.8"
object_store = "0.14"
prost = "0.14.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sonic-rs = "0.5.8"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
tonic-prost-build = "0.14.6"

[lints]
workspace = true
