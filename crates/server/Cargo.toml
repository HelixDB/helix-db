[package]
name = "server"
version = "0.1.0"
edition = "2024"

[features]
# Benchmark images only: explicit writer/reader role and periodic JSON samples.
async-index-benchmark = ["db/async-index-benchmark"]

[dependencies]
db = { path = "../db" }
helix-ast = { path = "../ast" }
helix-metrics = { path = "../metrics" }
mimalloc = "0.1.52"
axum = "0.8.8"
object_store = "0.14"
prost = "0.14.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slatedb = { git = "https://github.com/HelixDB/slatedb.git", rev = "50c063327b826c2c018c664171fc1ada5dc3096d" }
simd-json = { version = "0.18.1", default-features = false, features = [
    "runtime-detection",
    "serde_impl",
    "swar-number-parsing",
] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3.2"
tonic-prost-build = "0.14.6"

[dev-dependencies]
async-trait = "0.1"
helix-db = { path = "../../sdks/rust" }
helix-db-testkit = { path = "../db-testkit" }
helix-planner = { path = "../planner" }
tempfile = "3"
tokio-test = "0.4"
tokio-stream = { version = "0.1", features = ["net"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
