syntax = "proto3";

package helixdb.server.v1;

service HelixDbServer {
  rpc ExecuteQuery(QueryJsonRequest) returns (QueryJsonResponse);
  // body is the same lossless JSON request/result contract as POST /v2/cypher.
  rpc ExecuteCypher(QueryJsonRequest) returns (QueryJsonResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}

message QueryJsonRequest {
  bytes body = 1;
  bool warm_only = 2;
  bool require_writer = 3;
  bool await_durable = 4;
}

message QueryJsonResponse {
  bytes body = 1;
}

message HealthRequest {}

message HealthResponse {
  bool ready = 1;
  string mode = 2;
  string index_runtime = 3;
  reserved 4;
  reserved "text_index_runtime";
}
