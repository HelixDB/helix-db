syntax = "proto3";

package helixdb.server.v1;

service HelixDbServer {
  rpc ExecuteQuery(QueryJsonRequest) returns (QueryJsonResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}

message QueryJsonRequest {
  bytes body = 1;
  bool warm_only = 2;
  bool require_writer = 3;
  bool await_durable = 4;
}

message QueryJsonResponse {
  bytes body = 1;
}

message HealthRequest {}

message HealthResponse {
  bool ready = 1;
  string mode = 2;
  string index_runtime = 3;
  reserved 4;
  reserved "text_index_runtime";
  // Entities the index worker holds back because a queued operation of
  // theirs can never fit a publication under the current limits, or because
  // applying their queued change fails the same way every time. Only the
  // count: the writer's logs name each one.
  uint64 blocked_index_entity_count = 5;
}
