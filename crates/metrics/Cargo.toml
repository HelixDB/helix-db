[package]
name = "helix-metrics"
version = "0.1.1"
edition = "2024"
authors = ["HelixDB Team"]
repository = "https://github.com/HelixDB/helix-db"
license = "AGPL-3.0"
description = "Metrics for HelixDB"

[lints]
workspace = true

[dependencies]
chrono = "0.4"
dirs = "6.0"
flume = { version = "0.12", default-features = false, features = ["async"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "macros", "rt", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
url = "2.5"
uuid = { version = "1.18.0", features = ["v4", "v7", "fast-rng"] }

[dev-dependencies]
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
