[package]
name = "helix-ast-bench"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
helix-ast = { path = "../ast", features = ["simd-json"] }
helix-planner = { path = "../planner" }
simd-json = { version = "0.18.1", default-features = false, features = [
    "runtime-detection",
    "serde_impl",
    "swar-number-parsing",
] }
sonic-rs = "0.5.8"
# The server's allocator, so measurements match production.
mimalloc = "0.1.52"

[dev-dependencies]
helix-ast = { path = "../ast", features = ["simd-json", "test-utils"] }
divan = "0.1.21"
serde = "1"
libc = "0.2.186"

[[bench]]
name = "ast_parse"
harness = false

[[bench]]
name = "ast_throughput"
harness = false

[[bench]]
name = "ast_memory"
harness = false

[[bench]]
name = "ast_rss"
harness = false

[lints]
workspace = true
