name: Cloud launch PR

on:
  pull_request:
    paths:
      - ".github/workflows/cloud-launch-*.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/ast/**"
      - "crates/cli/**"
      - "crates/db/**"
      - "crates/db-testkit/**"
      - "crates/planner/**"
      - "crates/server/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-launch-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Format, Clippy, and doctests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: python3 scripts/validate-cargo-target-references.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace --doc

  workspace-tests:
    name: Workspace tests
    runs-on: ubuntu-24.04-arm
    # Two build jobs compile the whole workspace before any test runs.
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: sdks/typescript
      - run: cargo test --workspace

  db-all-targets:
    name: DB all targets
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p db --all-targets

  deterministic-contracts:
    name: Planner, lifecycle, isolation, and transports
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p helix-db-testkit --all-targets
      - run: cargo test -p server --all-targets
      - run: >-
          cargo test -p helix-cli --test api_contracts
          query_command_preserves_the_shared_transport_corpus -- --exact
      - run: scripts/planner-normalized-corpus.sh
