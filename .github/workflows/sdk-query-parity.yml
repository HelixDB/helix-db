name: SDK query parity

on:
  pull_request:
    paths:
      - ".github/workflows/sdk-query-parity.yml"
      - "bindings/uniffi/**"
      - "bindings/uniffi-bindgen/**"
      - "crates/ast/**"
      - "crates/db/**"
      - "sdks/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sdk-query-parity.yml"
      - "bindings/uniffi/**"
      - "bindings/uniffi-bindgen/**"
      - "crates/ast/**"
      - "crates/db/**"
      - "sdks/**"

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: npm ci
        working-directory: sdks/typescript
      - run: npm test
        working-directory: sdks/typescript
      - run: npm run parity:generate
        working-directory: sdks/typescript
      - run: npm run parity:compare-json
        working-directory: sdks/typescript
      - run: python -m unittest discover -s sdks/python/tests -v
        env:
          PYTHONPATH: sdks/python/src
      - run: go test ./...
        working-directory: sdks/go
      - run: cargo test --locked --manifest-path sdks/rust/Cargo.toml --lib
      - run: cargo test --locked -p helixdb-uniffi

  embedded:
    name: Generated embedded bindings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: false
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: sdks/typescript
      - run: npm run parity:embedded
        working-directory: sdks/typescript

  coverage:
    name: SDK coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - run: npm ci
        working-directory: sdks/typescript
      - run: npm run test:coverage
        working-directory: sdks/typescript
      - run: python -m pip install coverage
      - run: python -m coverage run --branch --source=helixdb -m unittest discover -s tests
        working-directory: sdks/python
      - run: python -m coverage report --fail-under=70
        working-directory: sdks/python
      - name: Go statement coverage
        shell: bash
        working-directory: sdks/go
        run: |
          go test . -coverprofile=coverage.out
          coverage=$(go tool cover -func=coverage.out | awk '/total:/ { gsub("%", "", $3); print $3 }')
          awk "BEGIN { if ($coverage < 45) exit 1 }"
      - run: cargo install cargo-llvm-cov --locked
      - name: Rust line coverage
        run: cargo llvm-cov --locked --manifest-path sdks/rust/Cargo.toml --features embedded --lib --ignore-filename-regex '(^|/)(crates|bindings)/' --fail-under-lines 65
