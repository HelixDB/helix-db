name: Rust CI

on:
  pull_request:
    paths:
      - ".config/nextest.toml"
      - ".github/workflows/rust-ci.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "bindings/uniffi/**"
      - "clippy.toml"
      - "crates/**"
      # Fixtures and docs that Rust tests embed with include_str!/include_bytes!;
      # the target-reference validator fails when one is missing here.
      - "docker-image/tests/fixtures/**"
      - "docs/database/helix-db/query-guides/error-handling.mdx"
      - "docs/database/helix-db/start-here/quickstart.mdx"
      - "docs/openapi.json"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "scripts/**"
      - "sdks/rust/**"
      - "sdks/typescript/**"
      - "tools/**"
  push:
    branches: [main]
    paths:
      - ".config/nextest.toml"
      - ".github/workflows/rust-ci.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "bindings/uniffi/**"
      - "clippy.toml"
      - "crates/**"
      # Fixtures and docs that Rust tests embed with include_str!/include_bytes!;
      # the target-reference validator fails when one is missing here.
      - "docker-image/tests/fixtures/**"
      - "docs/database/helix-db/query-guides/error-handling.mdx"
      - "docs/database/helix-db/start-here/quickstart.mdx"
      - "docs/openapi.json"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "scripts/**"
      - "sdks/rust/**"
      - "sdks/typescript/**"
      - "tools/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  lint:
    name: Format, Clippy, and target references
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      # Exact test-filter references compile test binaries, so they run in
      # cargo-target-references.yml only when a referenced target can change.
      - run: python3 scripts/validate-cargo-target-references.py --skip-test-filters
      - run: cargo clippy --locked --workspace -- -D warnings
      # The CLI and metrics crates also lint their tests.
      - run: >-
          cargo clippy --locked -p helix-cli -p helix-metrics --all-targets
          -- -D warnings
      # The test profile also lints the cfg(test) unit tests of both crates.
      - name: Clippy async index benchmark feature
        run: >-
          cargo clippy --locked -p db -p server --lib --bins --profile test
          --features server/async-index-benchmark -- -D warnings

  build-tests:
    name: Build test archive
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest
      # Bench targets have custom harnesses that nextest cannot list; the
      # doctests job runs them in test mode instead.
      - name: Build every workspace test target once
        run: >-
          cargo nextest archive --locked --workspace --lib --bins --tests --examples
          --archive-file nextest-archive.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: nextest-archive
          path: nextest-archive.tar.zst
          if-no-files-found: error
          retention-days: 1

  test:
    name: Tests (partition ${{ matrix.partition }}/8)
    needs: build-tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: taiki-e/install-action@nextest
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: sdks/typescript
      - uses: actions/download-artifact@v5
        with:
          name: nextest-archive
      - name: Run partition
        run: >-
          cargo nextest run --profile ci
          --archive-file nextest-archive.tar.zst
          --workspace-remap . --extract-to . --extract-overwrite
          --partition hash:${{ matrix.partition }}/8

  feature-contracts:
    name: DB feature-gated contracts
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest
      # The archive skips targets whose required features are off. List every
      # db test target that requires `index-lifecycle-testing` (but not
      # `production-scale`) here; the target-reference validator fails when
      # one is missing. Unit tests that need the feature live in
      # `lifecycle_testing_tests` modules; the filter runs only those from the
      # library, so the archive's unit tests do not run twice. Nextest runs
      # each test in its own process, so suites that serialize on a
      # process-wide lock still run in parallel.
      - run: >-
          cargo nextest run --profile ci --locked -p db
          --features index-lifecycle-testing
          --lib
          --test index_lifecycle_contracts
          --test production_index_operation_queue
          --test production_text_correctness_regressions
          --test production_text_queue_contracts
          -E 'kind(test) or test(/::lifecycle_testing_tests::/)'

  doctests:
    name: Doctests and planner corpus
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked --workspace --doc
      - run: scripts/planner-normalized-corpus.sh

  benches:
    name: Benches in test mode
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `--benches` also selects every library (libs default to
      # `bench = true`) and would rerun the unit tests, so name the
      # default-feature benches. Feature-gated benches run on demand.
      - run: >-
          cargo test --locked
          -p db -p helix-planner -p helix-graph-algorithms -p helix-ast-bench
          --bench embedded_write_latency --bench projection_materialization
          --bench property_row_reads --bench write_path_mutations
          --bench planner_scalability --bench v2_plan_quality
          --bench graph_algorithms
          --bench ast_memory --bench ast_parse --bench ast_rss
          --bench ast_throughput --bench planner_alloc --bench planner_arena
      # Feature-gated benches run full workloads from custom mains, so lint
      # them without running and test their fixtures instead. The
      # target-reference validator fails when a bench is named in no workflow.
      - name: Lint feature-gated benches
        run: >-
          cargo clippy --locked -p db
          --features bench-internals,index-lifecycle-testing
          --bench secondary_equality_hot_path --bench secondary_equality_read_scale
          --bench vector_batch_insert --bench vector_memory_store
          --bench text_transaction_batching --bench fts_prefilter
          --test bench_internals_contracts
          -- -D warnings
      - name: Benchmark fixture contracts
        run: >-
          cargo test --locked -p db --features bench-internals
          --test bench_internals_contracts

  benchmark-feature:
    name: Async index benchmark feature
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Benchmark unit tests
        run: >-
          cargo test --locked -p db -p server --lib
          --features server/async-index-benchmark benchmark::
      - name: Benchmark doctests
        run: cargo test --locked -p server --doc --features async-index-benchmark benchmark
