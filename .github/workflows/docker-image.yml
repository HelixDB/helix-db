name: Docker image

on:
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/workflows/docker-image.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Dockerfile"
      - "crates/**"
      - "docker-image/**"
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - ".github/workflows/docker-image.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Dockerfile"
      - "crates/**"
      - "docker-image/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Workspace and tooling quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docker-image/tests/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, llvm-tools-preview, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install Python coverage tooling
        run: python -m pip install --requirement docker-image/tests/requirements.txt
      - name: Install TypeScript workspace dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: sdks/typescript
      - name: Archive tooling branch coverage
        run: >-
          python -m coverage run --branch --source=docker-image
          --omit='docker-image/tests/*'
          -m unittest discover -s docker-image/tests -p 'test_*.py'
      - name: Enforce archive tooling coverage
        run: python -m coverage report --show-missing --fail-under=90
      - name: Workspace tests
        run: cargo test --locked --workspace --all-targets
      - name: Workspace doctests
        run: cargo test --locked --workspace --doc
      - name: Server coverage
        run: cargo llvm-cov --locked -p server --lib --fail-under-lines 80
      - name: Clippy
        run: cargo clippy --locked --workspace -- -D warnings
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Shell syntax
        run: bash -n docker-image/build.sh docker-image/test.sh docker-image/tests/*.sh

  image:
    name: Image (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      HELIX_IMAGE_REF: ghcr.io/helixdb/helixdb:ci-${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build native image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          tags: ${{ env.HELIX_IMAGE_REF }}
          load: true
          push: false
          provenance: false
          cache-from: type=gha,scope=helixdb-image-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=helixdb-image-${{ matrix.architecture }}
      - name: Packaging and runtime suite
        run: >-
          docker-image/test.sh
          --platform ${{ matrix.platform }}
          --image ${{ env.HELIX_IMAGE_REF }}
