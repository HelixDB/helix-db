name: Docker image

on:
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/workflows/docker-image.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Dockerfile"
      - "crates/**"
      - "docker-image/**"
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - ".github/workflows/docker-image.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Dockerfile"
      - "crates/**"
      - "docker-image/**"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Publish tested images under this new tag (for example v0.0.6); empty runs tests only"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Workspace and tooling quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docker-image/tests/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, llvm-tools-preview, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install Python coverage tooling
        run: python -m pip install --requirement docker-image/tests/requirements.txt
      - name: Install TypeScript workspace dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: sdks/typescript
      - name: Archive tooling branch coverage
        run: >-
          python -m coverage run --branch --source=docker-image
          --omit='docker-image/tests/*'
          -m unittest discover -s docker-image/tests -p 'test_*.py'
      - name: Enforce archive tooling coverage
        run: python -m coverage report --show-missing --fail-under=90
      - name: Workspace tests
        run: cargo test --locked --workspace --all-targets
      - name: Workspace doctests
        run: cargo test --locked --workspace --doc
      - name: Server coverage
        run: cargo llvm-cov --locked -p server --lib --fail-under-lines 80
      - name: Clippy
        run: cargo clippy --locked --workspace -- -D warnings
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Shell syntax
        run: bash -n docker-image/build.sh docker-image/test.sh docker-image/tests/*.sh

  image:
    name: Image (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      HELIX_IMAGE_REF: ghcr.io/helixdb/helixdb:ci-${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build native image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          tags: ${{ env.HELIX_IMAGE_REF }}
          load: true
          push: false
          provenance: false
          cache-from: type=gha,scope=helixdb-image-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=helixdb-image-${{ matrix.architecture }}
      - name: Packaging and runtime suite
        run: >-
          docker-image/test.sh
          --platform ${{ matrix.platform }}
          --image ${{ env.HELIX_IMAGE_REF }}

      - name: Save tested release image
        if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
        run: docker save "$HELIX_IMAGE_REF" | gzip > image-${{ matrix.architecture }}.tar.gz
      - name: Upload tested release image
        if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
        uses: actions/upload-artifact@v4
        with:
          name: tested-image-${{ matrix.architecture }}
          path: image-${{ matrix.architecture }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish tested image
    if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
    needs: [quality, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
      IMAGE_REPOSITORY: ghcr.io/helixdb/helixdb
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Validate release source and version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]] || { echo "Releases require the default branch" >&2; exit 1; }
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release version" >&2; exit 1; }
          grep -Fqx "pub const DEFAULT_LOCAL_IMAGE_TAG: &str = \"$RELEASE_VERSION\";" crates/cli/src/config.rs
          registry_token=$(curl --fail --silent --show-error --user "$GITHUB_ACTOR:$GH_TOKEN" \
            'https://ghcr.io/token?service=ghcr.io&scope=repository:helixdb/helixdb:pull' | jq -er '.token')
          echo "::add-mask::$registry_token"
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $registry_token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/helixdb/helixdb/manifests/$RELEASE_VERSION")
          [[ "$status" == 404 ]] || { echo "Release tag is not confirmed absent (HTTP $status)" >&2; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          pattern: tested-image-*
          path: tested-images
          merge-multiple: true
      - name: Publish exact tested images
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          refs=()
          for arch in amd64 arm64; do
            docker load --input "tested-images/image-$arch.tar.gz"
            ref="$IMAGE_REPOSITORY:release-$GITHUB_SHA-$GITHUB_RUN_ID-$arch"
            docker tag "$IMAGE_REPOSITORY:ci-$arch" "$ref"
            docker push "$ref"
            # Formatted .Manifest is the descriptor (with digest), unlike --raw.
            digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -er '.digest')
            refs+=("$IMAGE_REPOSITORY@$digest")
          done
          docker buildx imagetools create --tag "$IMAGE_REPOSITORY:$RELEASE_VERSION" "${refs[@]}"
          docker buildx imagetools inspect "$IMAGE_REPOSITORY:$RELEASE_VERSION" --raw | \
            jq -e '[.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]'
          docker buildx imagetools create --tag "$IMAGE_REPOSITORY:latest" "$IMAGE_REPOSITORY:$RELEASE_VERSION"
          docker buildx imagetools inspect "$IMAGE_REPOSITORY:$RELEASE_VERSION"
