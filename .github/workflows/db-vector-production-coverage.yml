name: Production coverage

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
    paths:
      - ".github/workflows/cloud-launch-vector-100k.yml"
      - ".github/workflows/db-vector-production-coverage.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/db/**"
      - "crates/db-testkit/**"
      - "crates/server/**"
      - "scripts/db-production-coverage*"
      - "scripts/server-production-coverage*"
  workflow_dispatch:
    inputs:
      profile:
        description: Manual production gate to run
        required: true
        default: coverage
        type: choice
        options:
          - coverage
          - vector-100k

permissions:
  contents: read

concurrency:
  group: production-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  production-coverage:
    name: DB production thresholds
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name != 'workflow_dispatch' || inputs.profile == 'coverage')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Verify coverage prerequisites
        run: jq --version
      - name: Enforce DB production coverage
        env:
          CARGO_INCREMENTAL: "0"
          DB_COVERAGE_FULL_REPORT_PATH: ${{ runner.temp }}/db-production-coverage.json
        run: scripts/db-production-coverage.sh
      - name: Preserve production coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-production-coverage
          path: ${{ runner.temp }}/db-production-coverage.json
          if-no-files-found: ignore
          retention-days: 7

  server-production-coverage:
    name: Transport and query-service thresholds
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name != 'workflow_dispatch' || inputs.profile == 'coverage')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Verify coverage prerequisites
        run: jq --version
      - name: Enforce transport and query-service production coverage
        run: scripts/server-production-coverage.sh

  architecture-kernels:
    name: ${{ matrix.kernel }}
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name != 'workflow_dispatch' || inputs.profile == 'coverage')
    strategy:
      fail-fast: false
      matrix:
        include:
          - kernel: x86_64 scalar reference
            runner: ubuntu-24.04
            rustflags: -C target-cpu=x86-64
            features: production-coverage,force-vector-scalar-kernel
          - kernel: x86_64 SSE4.1
            runner: ubuntu-24.04
            rustflags: -C target-cpu=x86-64 -C target-feature=+sse4.1,-avx,-avx2,-fma
            features: production-coverage
          - kernel: x86_64 AVX FMA
            runner: ubuntu-24.04
            rustflags: -C target-cpu=x86-64 -C target-feature=+sse4.1,+avx,+avx2,+fma
            features: production-coverage
          - kernel: aarch64 scalar reference
            runner: ubuntu-24.04-arm
            rustflags: ""
            features: production-coverage,force-vector-scalar-kernel
          - kernel: aarch64 NEON
            runner: ubuntu-24.04-arm
            rustflags: -C target-feature=+neon
            features: production-coverage
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Exercise scalar and native kernels directly
        run: >-
          cargo test -p db --features ${{ matrix.features }}
          --test production_internal_contracts
          vector_distance_neighbors_exercise_metric_and_graph_invariants

  vector-100k:
    name: Optimized vector 100k lifecycle
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'vector-100k'
    uses: ./.github/workflows/cloud-launch-vector-100k.yml
