[package]
name = "helix-db"
version = "3.0.0"
edition = "2024"
rust-version = "1.85.0"
description = "Library for working with HelixDB"
license = "Apache-2.0"
repository = "https://github.com/helixdb/helix-db/tree/main/sdks/rust"
documentation = "https://docs.rs/helix-db"
readme = "README.md"
keywords = ["graph", "database", "helixdb", "dsl", "query"]
categories = ["database", "data-structures"]

# # Standalone crate, not part of the root helix-db workspace.
# [workspace]

[lib]
path = "src/lib.rs"

[dependencies]
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sonic-rs = "0.5.8"
helix-ast = { path = "../../crates/ast" }
helix-graph = { path = "../../crates/graph-algorithms" }
helix-dsl-macros = { version = "0.3.0", path = "helix-dsl-macros" }
reqwest = { version = "0.13.3" }
tokio = { version = "1", features = ["full"] }
thiserror = "2.0.18"
uuid = { version = "1", features = ["serde"] }
db = { path = "../../crates/db", optional = true }

[features]
default = []
embedded = ["dep:db"]

[dev-dependencies]
tempfile = "3"
