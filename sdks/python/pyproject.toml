[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "helix-db"
version = "0.3.4"
description = "Python SDK for the HelixDB query DSL and client"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "HelixDB" }]
keywords = ["helixdb", "graph", "vector", "database", "dsl"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["httpx>=0.28.1,<1"]

[project.optional-dependencies]
dev = ["coverage>=7.10,<8", "ruff>=0.12,<1"]

[project.urls]
Homepage = "https://github.com/HelixDB/helix-db"
Repository = "https://github.com/HelixDB/helix-db"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
helixdb = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"src/helix_db/__init__.py" = ["F401", "F403"]
"src/helixdb/__init__.py" = ["F401", "F403"]
