# Transparent S3 request logger for the Compose smoke test. It forwards the
# client's Host header so SigV4 signatures still verify at SeaweedFS, streams
# bodies in both directions, and writes one JSON line per completed request.
log_format s3_trace escape=json
    '{"method":"$request_method","uri":"$uri","args":"$args",'
    '"range":"$http_range","status":$status}';

server {
    listen 8333;
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    access_log /dev/stdout s3_trace;

    location / {
        proxy_pass http://seaweedfs:8333;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
    }
}
